version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: reverie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reverie_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    ports:
      - "5432:5432"
    volumes:
      - reverie_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reverie_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./reverie-backend
      dockerfile: Dockerfile
    container_name: reverie-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/reverie_db
      DB_USER: postgres
      DB_PASSWORD: postgres_dev_password
      JWT_SECRET: reverie_dev_jwt_secret_key_change_in_production_min32chars!
      FRONTEND_ORIGIN: http://localhost:3000,http://localhost:3001
    ports:
      - "8080:8080"

volumes:
  reverie_pgdata:
