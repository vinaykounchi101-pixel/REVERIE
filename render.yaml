services:
  # =========================================================================
  # 1. REVERIE Spring Boot API Backend Service
  # =========================================================================
  - type: web
    name: reverie-backend
    runtime: java
    rootDir: reverie-backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -Dspring.profiles.active=prod -jar target/reverie-backend-1.0.0-SNAPSHOT.jar
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_ENVIRONMENT
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: REVERIE Haute Horlogerie
      - key: EMAIL_PROVIDER
        value: auto
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://reverie-frontend.onrender.com,http://localhost:3000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # =========================================================================
  # 2. REVERIE Next.js Luxury Frontend Web Application
  # =========================================================================
  - type: web
    name: reverie-frontend
    runtime: node
    rootDir: reverie-next
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: NEXT_PUBLIC_API_URL
        value: https://reverie-backend.onrender.com/api
